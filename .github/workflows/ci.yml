name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    name: L${{ matrix.laravel }} / PHP ${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: 12, php: '8.2', testbench: '^10.0' }
          - { laravel: 12, php: '8.3', testbench: '^10.0' }
          - { laravel: 12, php: '8.4', testbench: '^10.0' }
          - { laravel: 13, php: '8.3', testbench: '^11.0' }
          - { laravel: 13, php: '8.4', testbench: '^11.0' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Installer les dépendances
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction
      - name: Tests
        run: vendor/bin/pest

  quality:
    runs-on: ubuntu-latest
    name: Pint + Larastan
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer update --prefer-dist --no-interaction
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G
